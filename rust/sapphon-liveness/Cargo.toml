[package]
name = "sapphon-liveness"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "SAPPHON-132 Linux owner-identity and process-liveness recovery fence"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sapphon-audit = { path = "../sapphon-audit" }
sapphon-recovery = { path = "../sapphon-recovery" }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = "2.2"
base64 = "0.22"
sapphon-journal = { path = "../sapphon-journal" }
