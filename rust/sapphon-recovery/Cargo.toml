[package]
name = "sapphon-recovery"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "SAPPHON-131 synthetic operator-signed crash recovery receipts"
license = "MIT"

[dependencies]
sapphon-audit = { path = "../sapphon-audit" }
ed25519-dalek = "2.2"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sapphon-journal = { path = "../sapphon-journal" }
