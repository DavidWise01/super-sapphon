name: SAPPHON-145 Phase XIII Signed Anchor Restart Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - '.github/workflows/sapphon-145-anchor.yml'
      - 'docs/sapphon/phase-xiii/145/**'
permissions:
  contents: read
jobs:
  signed-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run anchor provider and inherited Linux Rust tests
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Run inherited recovery contention journal and audit suites
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Qualify the 188 historical frozen sources
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
              'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
              'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
              'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
              'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          n=0
          for m in manifests:
              for path,expected in json.loads(pathlib.Path(m).read_text())['files'].items():
                  data=pathlib.Path(path).read_bytes()
                  assert len(data)==expected['bytes'],path
                  assert hashlib.sha256(data).hexdigest()==expected['sha256'],path
                  n+=1
          assert n==188,n
          print(f'PASS {n}/188 historical source freezes')
          PY
      - name: Confirm source cannot grant external authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('rust/sapphon-liveness/src/anchor145.rs').read_text()
          for token in ('pub const AUTHORITY: &str = "HOLD"',
                        'provider_independence_proven:false',
                        'lock_cleared:false',
                        'external_checkpoint_accepted:false',
                        'ANCHOR_ROLLBACK','ANCHOR_SIGNATURE'):
              assert token in s,token
          print('PASS source retains HOLD')
          PY
