name: SAPPHON-185 Observed Runner Failure Isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_171_job_logs.py'
      - 'tools/sapphon_185_*.py'
      - 'tools/test_sapphon_185_*.py'
      - '.github/workflows/sapphon-185-observed.yml'
      - 'docs/sapphon/phase-xviii/185/**'
permissions:
  contents: read
  actions: read
jobs:
  observed-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Execute Python runner pagination and evidence tests
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_185_pagination.py
          python3 tools/test_sapphon_185_observed.py
          python3 tools/test_sapphon_184_freeze.py
          python3 tools/test_sapphon_183_contradictions.py
          python3 tools/test_sapphon_171_job_logs.py
      - name: Compile and test inherited Rust liveness suite
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify 188 historical immutable file sizes and SHA-256
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Read exact SAPPHON-184 freeze runner with complete bounded job pagination
        id: predecessor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_171_job_logs.py \
            --sha edb582df9db3873d2fe308d219ed30b412d1b06d \
            --workflow sapphon-184-freeze.yml \
            --required-job final-freeze \
            --out qualification-artifact/185-predecessor.json
      - name: Classify exact run child-step failures and readback gaps
        id: classify
        continue-on-error: true
        run: |
          python3 tools/sapphon_185_observed.py \
            --readback qualification-artifact/185-predecessor.json \
            --out qualification-artifact/185-diagnostic.json
      - name: Preserve observed stages and fixed recovery HOLD
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          CLASSIFY: ${{ steps.classify.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          keys=('PYTHON','RUST','FROZEN','PREDECESSOR','CLASSIFY')
          states={k:os.environ[k] for k in keys}
          body={'schema':'sapphon-185-current-run-v1',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'stages':states,
            'source_owned_tests_pass':all(states[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'exact_predecessor_evidence_complete':False,
            'independent_custody_authenticated':False,
            'global_anti_rollback_authenticated':False,
            'authenticated_utc':False,'npm_lock_qualified':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'OBSERVED_FAILURE_ISOLATION_HOLD'}
          pathlib.Path('qualification-artifact/185-summary.json').write_text(json.dumps(body,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload sanitized source-owned diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-185-observed-run-diagnostics
          path: |
            qualification-artifact/185-predecessor.json
            qualification-artifact/185-diagnostic.json
            qualification-artifact/185-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on source-test or historical integrity errors
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for check in PYTHON RUST FROZEN; do
            if [[ "${!check}" != success ]]; then
              echo "::error::$check = ${!check}; source diagnostic HOLD"
              exit 1
            fi
          done
          echo "Current source checks may pass. Predecessor readback, external custody and recovery remain separate."
