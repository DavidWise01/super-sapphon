name: SAPPHON-226 Portable Fork Evidence Export HOLD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_226_fork_export.py'
      - 'tools/test_sapphon_226_fork_export.py'
      - '.github/workflows/sapphon-226-fork-export.yml'
      - 'docs/sapphon/phase-xx/226/**'
permissions:
  contents: read
jobs:
  non-destructive-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run portable fork export regression cases
        run: |
          python3 -m py_compile tools/sapphon_226_fork_export.py tools/test_sapphon_226_fork_export.py
          PYTHONPATH=tools python3 tools/test_sapphon_226_fork_export.py
      - name: Preserve absent external fork and custody HOLD
        run: |
          mkdir -p qualification-evidence
          printf '{}\n' > qualification-evidence/226-no-external-forks.json
          set +e
          PYTHONPATH=tools python3 tools/sapphon_226_fork_export.py \
            --source qualification-evidence/226-no-external-forks.json \
            --bundle-out qualification-evidence/226-empty-handoff.json \
            --verdict-out qualification-evidence/226-handoff-verdict.json
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import json
          v=json.load(open('qualification-evidence/226-handoff-verdict.json'))
          assert v["state"]=="FORK_TRANSFER_REJECTED_HOLD"
          assert v["independently_authenticated_witnesses"]==0
          assert v["recovery_authorized"] is False and v["lock_cleared"] is False
          print("SAPPHON_226_NO_EXTERNAL_FORK_EVIDENCE__RECOVERY_HOLD")
          PY
      - name: Retain source-owned transfer decision
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-226-custody-transfer-hold
          path: |
            qualification-evidence/226-empty-handoff.json
            qualification-evidence/226-handoff-verdict.json
          retention-days: 30
          if-no-files-found: error
