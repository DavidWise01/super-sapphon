name: SAPPHON-171 Actual Job-Log Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_169_run_triage.py'
      - 'tools/test_sapphon_169_triage.py'
      - 'tools/sapphon_171_job_logs.py'
      - 'tools/test_sapphon_171_job_logs.py'
      - '.github/workflows/sapphon-171-joblogs.yml'
      - 'docs/sapphon/phase-xvi/171/**'
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Local and adversarial Python tests
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_171_job_logs.py
          python3 tools/test_sapphon_169_triage.py
          python3 tools/test_sapphon_165_lock.py
          python3 tools/test_sapphon_166_candidate.py
          python3 tools/test_sapphon_167_promotion.py
      - name: Run inherited Rust and SAPPHON-171 tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Read actual SAPPHON-170 job failures and redacted excerpts
        id: logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_171_job_logs.py --out qualification-artifact/171-job-log-triage.json
      - name: Verify all 188 inherited frozen bytes and hashes
        id: historical
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
            'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
            'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
            'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
            'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          seen=set()
          for f in manifests:
              for name,entry in json.loads(pathlib.Path(f).read_text())['files'].items():
                  assert name not in seen,('duplicate',name)
                  seen.add(name)
                  b=pathlib.Path(name).read_bytes()
                  assert len(b)==entry['bytes'],('length',name)
                  assert hashlib.sha256(b).hexdigest()==entry['sha256'],('digest',name)
          assert len(seen)==188,len(seen)
          print('PASS 188 historical frozen source entries')
          PY
      - name: Observe committed npm lock integrity without promotion
        id: lock
        continue-on-error: true
        run: python3 tools/sapphon_165_lock_inspect.py --out qualification-artifact/171-lock.json
      - name: Compare four Pages HTML assets to exact run revision
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sapphon_164_pages_parity.py --commit '${{ github.sha }}' --out qualification-artifact/171-pages.json
      - name: Preserve outcomes even on qualification failure
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          LOGS: ${{ steps.logs.outcome }}
          HISTORICAL: ${{ steps.historical.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          PAGES: ${{ steps.pages.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          names=('PYTHON','RUST','LOGS','HISTORICAL','LOCK','PAGES')
          record={'schema':'sapphon-171-diagnostic-evidence-v1',
             'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
             'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
             'outcomes':{n:os.environ[n] for n in names},
             'diagnostic_source_pass':all(os.environ[n]=='success' for n in ('PYTHON','RUST','HISTORICAL')),
             'full_qualification':False,'independent_custody_authenticated':False,
             'global_anti_rollback_authenticated':False,
             'recovery_authorized':False,'lock_cleared':False,
             'decision':'OBSERVATION_AND_REPAIR_HOLD'}
          pathlib.Path('qualification-artifact/171-summary.json').write_text(
            json.dumps(record,sort_keys=True,indent=2)+'\n')
          PY
      - name: Always retain diagnostics and bounded job-log excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-171-job-log-evidence
          path: qualification-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Fail when executable diagnostic or historic source gate fails
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          HISTORICAL: ${{ steps.historical.outcome }}
        run: |
          for step in PYTHON RUST HISTORICAL; do
            if [[ "${!step}" != success ]]; then
              echo "::error::$step = ${!step}; qualification HOLD"
              exit 1
            fi
          done
          echo 'Source-owned diagnostics passed; remaining qualifications and physical authority HOLD.'
