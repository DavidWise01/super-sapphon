name: SAPPHON-223 External Checkpoint Continuity HOLD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_223_checkpoint.py'
      - 'tools/test_sapphon_223_checkpoint.py'
      - '.github/workflows/sapphon-223-checkpoint.yml'
      - 'docs/sapphon/phase-xx/223/**'
permissions:
  contents: read
jobs:
  custody-chain-no-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check checkpoint verifier syntax and 14 regressions
        run: |
          python3 -m py_compile tools/sapphon_223_checkpoint.py tools/test_sapphon_223_checkpoint.py
          python3 tools/test_sapphon_223_checkpoint.py
      - name: Record missing authenticated external checkpoint HOLD
        run: |
          mkdir -p qualification-evidence
          printf '[]\n' > qualification-evidence/223-no-external-checkpoints.json
          set +e
          python3 tools/sapphon_223_checkpoint.py \
            --records qualification-evidence/223-no-external-checkpoints.json \
            --out qualification-evidence/223-checkpoint-verdict.json
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import json
          v=json.load(open("qualification-evidence/223-checkpoint-verdict.json"))
          assert v["state"]=="CHECKPOINT_CHAIN_REJECTED_HOLD"
          assert "NO_CHECKPOINTS" in v["blockers"]
          assert v["independently_authenticated_witnesses"]==0
          assert v["recovery_authorized"] is False and v["lock_cleared"] is False
          print("SAPPHON_223_NO_EXTERNAL_CHECKPOINT_AUTHORITY__HOLD")
          PY
      - name: Retain negative-control checkpoint verdict
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-223-checkpoint-continuity-hold
          path: qualification-evidence/223-checkpoint-verdict.json
          retention-days: 30
          if-no-files-found: error
