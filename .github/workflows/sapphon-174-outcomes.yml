name: SAPPHON-174 Observed Runner Outcome Separation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_171_job_logs.py'
      - 'tools/sapphon_174_*.py'
      - '.github/workflows/sapphon-174-outcomes.yml'
      - 'docs/sapphon/phase-xvi/174/**'
permissions:
  contents: read
  actions: read
jobs:
  source-outcomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run offline Python regressions
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_174_outcomes.py
          python3 tools/test_sapphon_173_critical_steps.py
          python3 tools/test_sapphon_172_reconcile.py
          python3 tools/test_sapphon_171_job_logs.py
          python3 tools/test_sapphon_169_triage.py
          python3 tools/test_sapphon_165_lock.py
          python3 tools/test_sapphon_166_candidate.py
          python3 tools/test_sapphon_167_promotion.py
      - name: Run inherited Rust regression suites
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify inherited 188 historical byte and SHA256 constraints
        id: frozen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
            'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
            'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
            'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
            'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          seen=set()
          for f in manifests:
            for name,info in json.loads(pathlib.Path(f).read_text())['files'].items():
              assert name not in seen,('duplicate path',name)
              seen.add(name);b=pathlib.Path(name).read_bytes()
              assert len(b)==info['bytes'],('wrong byte count',name)
              assert hashlib.sha256(b).hexdigest()==info['sha256'],('wrong digest',name)
          assert len(seen)==188,len(seen)
          print('PASS 188/188 historical hash declarations')
          PY
      - name: Read SAPPHON-173 exact run and required job steps
        id: predecessor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_171_job_logs.py \
            --sha 7e1be863797ddad3043e03074fc2375b9f760c74 \
            --workflow sapphon-173-steps.yml \
            --required-job critical-step-diagnostics \
            --out qualification-artifact/174-predecessor.json
      - name: Qualify source-owned runner steps only
        id: outcome
        continue-on-error: true
        run: |
          python3 tools/sapphon_174_outcomes.py \
            --input qualification-artifact/174-predecessor.json \
            --out qualification-artifact/174-outcome.json
      - name: Inspect committed lockfile without mutation
        id: lock
        continue-on-error: true
        run: python3 tools/sapphon_165_lock_inspect.py --out qualification-artifact/174-lock.json
      - name: Compare Pages assets at exact source revision
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sapphon_164_pages_parity.py --commit '${{ github.sha }}' --out qualification-artifact/174-pages.json
      - name: Record each observation without authority promotion
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          OUTCOME: ${{ steps.outcome.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          PAGES: ${{ steps.pages.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          names=('PYTHON','RUST','FROZEN','PREDECESSOR','OUTCOME','LOCK','PAGES')
          results={k:os.environ[k] for k in names}
          report={'schema':'sapphon-174-owned-outcome-report-v1',
             'commit_sha':os.environ['GITHUB_SHA'],
             'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
             'outcomes':results,
             'current_source_diagnostics_pass':all(results[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
             'full_qualification':False,
             'independent_custody_authenticated':False,
             'global_anti_rollback_authenticated':False,'authenticated_utc':False,
             'key_rotation_authorized':False,'recovery_authorized':False,
             'lock_cleared':False,'decision':'SOURCE_OUTCOMES_HOLD'}
          pathlib.Path('qualification-artifact/174-summary.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          PY
      - name: Always preserve source-owned diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-174-source-outcomes
          path: qualification-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Block source diagnostics when Python Rust or frozen hashes fail
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for check in PYTHON RUST FROZEN; do
            if [[ "${!check}" != success ]]; then
              echo "::error::$check = ${!check}; HOLD"
              exit 1
            fi
          done
          echo "Source tests observed on this GitHub runner only; lock, Pages, external custody and recovery HOLD."
