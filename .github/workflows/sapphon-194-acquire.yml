name: SAPPHON-194 Hosted Original Diagnostic Evidence Acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_194_*.py'
      - 'tools/test_sapphon_194_*.py'
      - '.github/workflows/sapphon-194-acquire.yml'
      - 'docs/sapphon/phase-xix/194/**'
permissions:
  contents: read
  actions: read
jobs:
  original-byte-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Exercise original-byte acquisition and inherited negative controls
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_194_acquire.py
          python3 tools/test_sapphon_193_triage.py
          python3 tools/test_sapphon_192_freeze.py
      - name: Compile and test Rust source evidence gates
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify inherited 188 protected historical paths
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Acquire exact SAPPHON-193 hosted run logs and original ZIP
        id: acquisition
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_194_acquire.py --out qualification-artifact/194-acquisition.json
      - name: Distinguish current source test execution from prior-run availability
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          ACQUISITION: ${{ steps.acquisition.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          keys=('PYTHON','RUST','FROZEN','ACQUISITION')
          states={k:os.environ[k] for k in keys}
          p=pathlib.Path('qualification-artifact/194-acquisition.json')
          report=json.loads(p.read_text()) if p.is_file() else {}
          record={'schema':'sapphon-194-owned-run-results-v1',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':states,
            'source_owned_tests_pass':all(states[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'predecessor_original_bytes_complete':report.get('source_owned_original_bytes_complete') is True,
            'actual_failed_steps':report.get('actual_failed_steps',[]),
            'independent_witnesses':0,'authenticated_utc':False,
            'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'HOSTED_ORIGINAL_BYTES_ACQUISITION_HOLD'}
          pathlib.Path('qualification-artifact/194-summary.json').write_text(
            json.dumps(record,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload sanitized hashes and source-owned results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-194-hosted-original-byte-diagnostics
          path: |
            qualification-artifact/194-acquisition.json
            qualification-artifact/194-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on current Python Rust or immutable-history execution errors
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for k in PYTHON RUST FROZEN; do
            if [[ "${!k}" != success ]]; then
              echo "::error::$k = ${!k}; operational HOLD"
              exit 1
            fi
          done
          echo "Current source checks complete. Original predecessor acquisition remains a distinct gate."
