name: SAPPHON-170 Targeted Runtime Failure Isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_169_run_triage.py'
      - 'tools/test_sapphon_169_triage.py'
      - '.github/workflows/sapphon-170-isolation.yml'
      - 'docs/sapphon/phase-xvi/170/**'
permissions:
  contents: read
  actions: read
jobs:
  deterministic-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Python triage logic including newest-run replay
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_169_triage.py
          python3 tools/test_sapphon_165_lock.py
          python3 tools/test_sapphon_166_candidate.py
          python3 tools/test_sapphon_167_promotion.py
      - name: Run Rust typecheck and all inherited tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Check all 188 frozen source byte counts and SHA-256
        id: frozen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
            'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
            'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
            'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
            'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          seen=set()
          for manifest in manifests:
            for path,info in json.loads(pathlib.Path(manifest).read_text())['files'].items():
              assert path not in seen,('duplicate',path)
              seen.add(path)
              b=pathlib.Path(path).read_bytes()
              assert len(b)==info['bytes'],('size mismatch',path)
              assert hashlib.sha256(b).hexdigest()==info['sha256'],('digest mismatch',path)
          assert len(seen)==188,len(seen)
          print('PASS exact historical 188-file integrity')
          PY
      - name: Query real predecessor run and failed steps
        id: predecessor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_169_run_triage.py --sha 'e9f983e28da437b80b6c22be1107a099df381f38' \
            --workflow sapphon-169-triage.yml \
            --out qualification-artifact/170-predecessor-triage.json
      - name: Observe unqualified committed npm lockfile separately
        id: lock
        continue-on-error: true
        run: python3 tools/sapphon_165_lock_inspect.py --out qualification-artifact/170-provisional-lock.json
      - name: Compare existing Pages bytes to pinned source
        id: parity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sapphon_164_pages_parity.py --commit '${{ github.sha }}' --out qualification-artifact/170-pages-parity.json
      - name: Record diagnostic outcomes without claiming operational authority
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          GH_SHA: ${{ github.sha }}
          GH_RUN: ${{ github.run_id }}
          GH_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          names=('PYTHON','RUST','FROZEN','PREDECESSOR','LOCK','PARITY')
          data={'schema':'sapphon-170-diagnostics-v1',
                'commit':os.environ['GH_SHA'],'run_id':os.environ['GH_RUN'],
                'attempt':os.environ['GH_ATTEMPT'],
                'results':{n:os.environ[n] for n in names},
                'source_diagnostics_passed':all(os.environ[n]=='success' for n in ('PYTHON','RUST','FROZEN')),
                'qualification_passed':False,
                'independent_custody_authenticated':False,
                'global_anti_rollback_authenticated':False,
                'recovery_authorized':False,'lock_cleared':False,
                'decision':'TARGETED_DIAGNOSTICS_HOLD'}
          pathlib.Path('qualification-artifact/170-outcomes.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print(data['results'])
          PY
      - name: Upload both failures and successes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-170-diagnostics
          path: qualification-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Fail if Rust, Python or historic integrity checks fail
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for n in PYTHON RUST FROZEN; do
            if [[ "${!n}" != success ]]; then
              echo "::error::Diagnostic gate $n = ${!n}"
              exit 1
            fi
          done
          echo 'Source diagnostics passed on GitHub runner; lock, Pages, external custody and recovery still HOLD.'
