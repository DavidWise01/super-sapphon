name: SAPPHON-113 Phase IX Single Writer & Epoch Fencing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_113_fence.cjs'
      - 'tools/test_sapphon_113_fence.cjs'
      - 'docs/sapphon/phase-ix/113/**'
      - '.github/workflows/sapphon-113-fence.yml'
permissions:
  contents: read
jobs:
  fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test epoch fencing, exclusive writer, partition HOLD and rejection audit
        run: node tools/test_sapphon_113_fence.cjs
      - name: Preserve inherited split brain counterexample and durable capture regression
        run: |
          node tools/test_sapphon_112_splitbrain.cjs
          node tools/test_sapphon_111_durable_capture.cjs
      - name: Verify neon viewer and all three immutable phase freezes
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-ix/113/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m,'missing viewer script');
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase IX · 1/8'])
            assert(h.includes(s),'missing '+s);
          console.log('PASS SAPPHON-113 neon geometry and authority HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json'):
              d=json.loads(pathlib.Path(p).read_text())
              for f,meta in d['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==meta['sha256'] and len(blob)==meta['bytes'],f
              print('PASS',p,len(d['files']),'immutable hashes')
          PY
