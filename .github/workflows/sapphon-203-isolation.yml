name: SAPPHON-203 Verified Failure Docker Isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_203_*.py'
      - 'tools/test_sapphon_203_*.py'
      - '.github/workflows/sapphon-203-isolation.yml'
      - 'docs/sapphon/phase-xx/203/**'
permissions:
  contents: read
  actions: read
jobs:
  sandboxed-replay-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current source for diagnostics
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact original 201 source as read-only replay input
        uses: actions/checkout@v4
        with:
          repository: DavidWise01/super-sapphon
          ref: b5ddf7f7d7d51a282c0109276dc37310f56eb240
          path: qualification-input
          persist-credentials: false
      - name: Execute negative-control Python tests
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_203_isolated_replay.py
          python3 tools/test_sapphon_202_reproduce.py
          python3 tools/test_sapphon_201_runner.py
      - name: Compile and run Rust source validation
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify immutable historic 188 files
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Check pinned source revision
        id: ancestry
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git -C qualification-input rev-parse HEAD)" = "b5ddf7f7d7d51a282c0109276dc37310f56eb240"
      - name: Reacquire exact original 201 evidence then gate Docker replay
        id: replay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qualification-artifact
          python3 tools/sapphon_203_isolated_replay.py \
            --checkout qualification-input \
            --out qualification-artifact/203-replay.json
      - name: Record actual source execution versus observed reproduction
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          ANCESTRY: ${{ steps.ancestry.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          steps={key:os.environ[key] for key in ('PYTHON','RUST','FROZEN','ANCESTRY','REPLAY')}
          p=pathlib.Path('qualification-artifact/203-replay.json')
          evidence=json.loads(p.read_text()) if p.is_file() else {}
          body={'schema':'sapphon-203-source-run-v1',
            'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':steps,
            'current_source_tests_pass':all(steps[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'original_201_checkout_verified':steps['ANCESTRY']=='success',
            'source_readback_consistent':evidence.get('evidence_consistent') is True,
            'sandbox_replay_executed':evidence.get('replay_executed') is True,
            'original_failure_reproduced':evidence.get('actual_failure_reproduced') is True,
            'replay_state':evidence.get('state','NOT_OBSERVED'),
            'independent_witnesses':0,'external_custody_authenticated':False,
            'authenticated_utc':False,'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'PHASE_XX_SANDBOXED_REPLAY_HOLD'}
          pathlib.Path('qualification-artifact/203-summary.json').write_text(
            json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload hashes and outcomes, never original secret-bearing logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-203-sandboxed-replay-evidence
          path: |
            qualification-artifact/203-replay.json
            qualification-artifact/203-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on current test or checkout failures, preserve missing evidence
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          ANCESTRY: ${{ steps.ancestry.outcome }}
        run: |
          for key in PYTHON RUST FROZEN ANCESTRY; do
            if [[ "${!key}" != success ]]; then
              echo "::error::$key = ${!key}; source HOLD"
              exit 1
            fi
          done
          echo "Source checks and checkout observed; original replay and operational authority remain separately gated."
