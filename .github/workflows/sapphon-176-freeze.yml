name: SAPPHON-176 Phase XVI Final Evidence Freeze
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_171_job_logs.py'
      - 'tools/sapphon_176_*.py'
      - '.github/workflows/sapphon-176-freeze.yml'
      - 'docs/sapphon/phase-xvi/176/**'
permissions:
  contents: read
  actions: read
jobs:
  final-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Execute Python adversarial and source-freeze tests
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_176_freeze.py
          python3 tools/test_sapphon_175_observed.py
          python3 tools/test_sapphon_171_job_logs.py
          python3 tools/test_sapphon_174_outcomes.py
          python3 tools/test_sapphon_173_critical_steps.py
          python3 tools/test_sapphon_172_reconcile.py
          python3 tools/test_sapphon_169_triage.py
          python3 tools/test_sapphon_165_lock.py
          python3 tools/test_sapphon_166_candidate.py
          python3 tools/test_sapphon_167_promotion.py
      - name: Run all inherited Rust source checks and test suites
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Check exact bytes and SHA-256 for 188 inherited frozen sources
        id: frozen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
            'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
            'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
            'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
            'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          seen=set()
          for manifest in manifests:
            for path,meta in json.loads(pathlib.Path(manifest).read_text())['files'].items():
              assert path not in seen,('duplicate historical path',path)
              seen.add(path);data=pathlib.Path(path).read_bytes()
              assert len(data)==meta['bytes'],('length',path)
              assert hashlib.sha256(data).hexdigest()==meta['sha256'],('digest',path)
          assert len(seen)==188,len(seen)
          print('PASS 188 immutable historical records')
          PY
      - name: Read exact SAPPHON-175 run attempt and diagnostic steps
        id: predecessor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_171_job_logs.py \
            --sha 134dd02d0d6728abc27264548fed4c91a223e9e4 \
            --workflow sapphon-175-readback.yml \
            --required-job source-diagnostics \
            --out qualification-artifact/176-predecessor-run.json
      - name: Inspect the unchanged provisional lockfile
        id: lock
        continue-on-error: true
        run: python3 tools/sapphon_165_lock_inspect.py --out qualification-artifact/176-lock.json
      - name: Compare four Pages HTML assets to exact source revision
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sapphon_164_pages_parity.py --commit '${{ github.sha }}' --out qualification-artifact/176-pages.json
      - name: Create exact eight-bound freeze inventory with distinct outcome states
        id: inventory
        if: always()
        continue-on-error: true
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          PAGES: ${{ steps.pages.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          statuses={k:os.environ[k] for k in ('PYTHON','RUST','FROZEN','PREDECESSOR','LOCK','PAGES')}
          statuses['REVIEW']='not_observed'
          result={'schema':'sapphon-176-runner-outcomes-v1',
             'commit_sha':os.environ['GITHUB_SHA'],
             'run_id':os.environ['GITHUB_RUN_ID'],
             'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
             'outcomes':statuses,
             'source_tests_passed':all(statuses[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
             'external_custody_authenticated':False,
             'global_anti_rollback_authenticated':False,
             'recovery_authorized':False,'lock_cleared':False,
             'decision':'PHASE_XVI_DESIGN_COMPLETE_QUALIFICATION_HOLD'}
          pathlib.Path('qualification-artifact/176-outcomes.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          python3 tools/sapphon_176_freeze.py --head '${{ github.sha }}' \
             --outcomes qualification-artifact/176-outcomes.json \
             --out qualification-artifact/176-freeze.json
          git diff --exit-code -- package-lock.json
      - name: Preserve all outcomes even when tests or evidence acquisition fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-176-final-phase-xvi-freeze
          path: qualification-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Block diagnostic completion if source checks or inventory failed
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
        run: |
          for k in PYTHON RUST FROZEN INVENTORY; do
            if [[ "${!k}" != success ]]; then
              echo "::error::$k = ${!k}; source qualification HOLD"
              exit 1
            fi
          done
          echo "Phase XVI source-design freeze recorded on this owned runner. Full qualification and recovery HOLD."
