name: SAPPHON-202 Hosted Failure Reproduction Ancestry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_202_*.py'
      - 'tools/test_sapphon_202_*.py'
      - '.github/workflows/sapphon-202-reproduce.yml'
      - 'docs/sapphon/phase-xx/202/**'
permissions:
  contents: read
  actions: read
jobs:
  exact-failure-ancestry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run observed-failure source controls and inherited negative cases
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_202_reproduce.py
          python3 tools/test_sapphon_201_runner.py
          python3 tools/test_sapphon_200_freeze.py
      - name: Compile all Linux Rust and source failure ancestry tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Check all historical protected files
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Acquire original exact SAPPHON-201 job log and artifact ZIP
        id: observe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_202_reproduce.py --out qualification-artifact/202-adjudication.json
      - name: Write bounded observed-versus-authored source results
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          OBSERVE: ${{ steps.observe.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          states={key:os.environ[key] for key in ('PYTHON','RUST','FROZEN','OBSERVE')}
          file=pathlib.Path('qualification-artifact/202-adjudication.json')
          observed=json.loads(file.read_text()) if file.exists() else {}
          body={'schema':'sapphon-202-source-results-v1',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':states,
            'source_owned_tests_pass':all(states[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'predecessor_source_state':observed.get('state','NOT_OBSERVED'),
            'original_bytes_complete':observed.get('original_bytes_complete') is True,
            'predecessor_failed_steps':observed.get('observed_201_failures',[]),
            'reviewed_replay_plans':observed.get('replay_plan',[]),
            'replay_executed':False,
            'independent_witnesses':0,'external_custody_authenticated':False,
            'authenticated_utc':False,'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'PHASE_XX_REPRODUCIBLE_FAILURE_HOLD'}
          pathlib.Path('qualification-artifact/202-summary.json').write_text(
            json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload sanitized log/ZIP digests and reviewed plans only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-202-hosted-failure-ancestry
          path: |
            qualification-artifact/202-adjudication.json
            qualification-artifact/202-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail current source regressions but never infer predecessor success
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for key in PYTHON RUST FROZEN; do
            if [[ "${!key}" != success ]]; then
              echo "::error::$key = ${!key}; HOLD"
              exit 1
            fi
          done
          echo "Current source checks observed; original 201 failure and recovery remain separate."
