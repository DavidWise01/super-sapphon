name: SAPPHON-125 Cross-Replica Revocation High Water
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_125_replica.cjs'
      - 'tools/test_sapphon_125_replica.cjs'
      - 'docs/sapphon/phase-x/125/**'
      - '.github/workflows/sapphon-125-replica.yml'
permissions:
  contents: read
jobs:
  high-water:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify lagging replicas, revoked roles and mandatory signed high-water
        run: node tools/test_sapphon_125_replica.cjs
      - name: Preserve inherited local revocation and challenge regressions
        run: |
          node tools/test_sapphon_124_revocation.cjs
          node tools/test_sapphon_123_challenge.cjs
      - name: Verify neon viewer and 140 inherited frozen file hashes
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-x/125/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase X · 5/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-125 neon viewer syntax and independent high-water HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json','docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json'):
              d=json.loads(pathlib.Path(p).read_text())
              for f,record in d['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],f
              print('PASS',p,len(d['files']),'frozen hashes')
          PY
