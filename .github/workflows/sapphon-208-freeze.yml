name: SAPPHON-208 Final Phase XX Source and Original Artifact Freeze
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_208_*.py'
      - 'tools/test_sapphon_208_*.py'
      - '.github/workflows/sapphon-208-freeze.yml'
      - 'docs/sapphon/phase-xx/208/**'
permissions:
  contents: read
  actions: read
jobs:
  phase-xx-final-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test original 207 tar and image readback plus eight-bound freeze
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_208_final.py
          python3 tools/test_sapphon_207_vendor.py
          python3 tools/test_sapphon_206_import_lock.py
          python3 tools/test_sapphon_205_lock_provenance.py
      - name: Rust compile and regression tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify 188 protected historical source paths
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Inventory exact eight-module Phase XX source and fetch original 207 artifact
        id: readback
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qualification-artifact
          python3 tools/sapphon_208_final.py \
            --root . \
            --out qualification-artifact/208-final.json
      - name: Record authored versus observed completion separately
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          READBACK: ${{ steps.readback.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          stages={k:os.environ[k] for k in ('PYTHON','RUST','FROZEN','READBACK')}
          p=pathlib.Path('qualification-artifact/208-final.json')
          frozen=json.loads(p.read_text()) if p.is_file() else {}
          summary={
            'schema':'sapphon-208-owned-final-outcomes-v1',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':stages,
            'source_design_complete':frozen.get('source_design_complete') is True,
            'source_tests_pass':all(stages[x]=='success' for x in ('PYTHON','RUST','FROZEN')),
            'source_inventory_sha256':frozen.get('source_inventory_sha256'),
            'original_207_state':frozen.get('original_207_evidence_state','NOT_OBSERVED'),
            'original_vendor_archive_verified':frozen.get('vendor_archive_verified') is True,
            'original_image_archive_verified':frozen.get('image_archive_verified') is True,
            'external_custody_authenticated':False,'independent_witnesses':0,
            'authenticated_utc':False,'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'PHASE_XX_FINAL_FREEZE_HOLD'}
          pathlib.Path('qualification-artifact/208-summary.json').write_text(
            json.dumps(summary,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload source-owned final bound and observed/unobserved evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-208-phase-xx-final-freeze
          path: |
            qualification-artifact/208-final.json
            qualification-artifact/208-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on source regressions, not on absent original artifact evidence
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          READBACK: ${{ steps.readback.outcome }}
        run: |
          for key in PYTHON RUST FROZEN READBACK; do
            if [[ "${!key}" != success ]]; then
              echo "::error::$key = ${!key}; source freeze HOLD"
              exit 1
            fi
          done
          echo "Eight source bounds inventoried. Source-owned original artifact and operational authority are separate."
