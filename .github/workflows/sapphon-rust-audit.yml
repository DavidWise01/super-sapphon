name: SAPPHON Rust — Signed Publication & Ancestry Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-audit/**'
      - '.github/workflows/sapphon-rust-audit.yml'
permissions:
  contents: write
jobs:
  rust-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rust/sapphon-audit
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain version
        run: rustc --version && cargo --version
      - name: Format Rust source
        run: cargo fmt --all
      - name: Compile and execute Rust audit regressions
        run: cargo test --all-targets --verbose
      - name: Verify Rust documentation
        run: cargo doc --no-deps
      - name: Preserve all prior immutable software baselines
        working-directory: .
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json',
                    'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
                    'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
                    'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json'):
              data=json.loads(pathlib.Path(p).read_text())
              for name,record in data['files'].items():
                  blob=pathlib.Path(name).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],name
              print('PASS',p,len(data['files']),'immutable sources')
          PY
      - name: Commit verified Rust formatting
        working-directory: .
        run: |
          git add rust/sapphon-audit/src rust/sapphon-audit/tests
          if git diff --cached --quiet; then
            echo "Rust formatting already canonical"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'SAPPHON Rust: canonical rustfmt after verified cargo tests'
            git push origin HEAD:main
          fi
