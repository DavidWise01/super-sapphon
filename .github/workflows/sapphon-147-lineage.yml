name: SAPPHON-147 Phase XIII Ancestry and Rotation Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - '.github/workflows/sapphon-147-lineage.yml'
      - 'docs/sapphon/phase-xiii/147/**'
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run verified-prefix lineage and key-rotation Rust regressions
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Inherited recovery contention journal and audit regression suites
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify 188 inherited frozen hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
              'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
              'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
              'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
              'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          count=0
          for manifest in manifests:
              for path,expected in json.loads(pathlib.Path(manifest).read_text())['files'].items():
                  data=pathlib.Path(path).read_bytes()
                  assert len(data)==expected['bytes'],path
                  assert hashlib.sha256(data).hexdigest()==expected['sha256'],path
                  count+=1
          assert count==188,count
          print(f'PASS {count}/188 frozen sources')
          PY
      - name: Enforce no authority promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('rust/sapphon-liveness/src/lineage147.rs').read_text()
          for term in ('pub const AUTHORITY: &str = "HOLD"',
                       'independently_custodied:false','lock_cleared:false',
                       'ROTATION_SIGNATURE','LINEAGE_NEWER_NOT_OBSERVED',
                       'ProvenPrefixWithLag','ConflictingHistory'):
              assert term in s,term
          print('PASS HOLD and provenance gates')
          PY
      - name: Build Rust documentation
        run: cargo doc --manifest-path rust/sapphon-liveness/Cargo.toml --no-deps
