name: SAPPHON-132 Rust Linux Process Identity & Liveness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'docs/sapphon/phase-xi/132/**'
      - '.github/workflows/sapphon-132-liveness.yml'
permissions:
  contents: write
concurrency:
  group: sapphon-132-linux-liveness
  cancel-in-progress: false
jobs:
  liveness:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Linux process-liveness Rust code
        run: cargo fmt --manifest-path rust/sapphon-liveness/Cargo.toml --all
      - name: Execute actual Linux process owner and PID identity tests
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Preserve signed recovery, process and journal regressions
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify Rust documentation
        run: cargo doc --manifest-path rust/sapphon-liveness/Cargo.toml --no-deps
      - name: Verify neon viewer and OS-owner authenticity HOLD
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-xi/132/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1',
            'PHYSICAL CLOCK + CUSTODY HOLD','Phase XI · 4/8','SPOOFED MARKER'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-132 neon liveness viewer and authority HOLD');
          NODE
      - name: Check all 188 inherited frozen source hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          paths=('docs/sapphon/SAPPHON-096-FREEZE.json',
             'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
             'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
             'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
             'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          total=0
          for path in paths:
            files=json.loads(pathlib.Path(path).read_text())['files']
            for filename,expected in files.items():
              b=pathlib.Path(filename).read_bytes()
              assert hashlib.sha256(b).hexdigest()==expected['sha256'] and len(b)==expected['bytes'],filename
            total+=len(files)
            print('PASS',path,len(files),'frozen hashes')
          assert total==188,total
          print('PASS 188/188 historical software freezes')
          PY
      - name: Commit verified Rust formatting
        run: |
          git add rust/sapphon-liveness/src rust/sapphon-liveness/tests
          if git diff --cached --quiet; then
            echo 'Rust formatting already canonical'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'SAPPHON-132: verified canonical Linux liveness Rust formatting'
            git push origin HEAD:main
          fi
