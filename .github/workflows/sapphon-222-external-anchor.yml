name: SAPPHON-222 Independent Key Anchor & Custody Ancestry HOLD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_222_external_anchor.py'
      - 'tools/test_sapphon_222_external_anchor.py'
      - '.github/workflows/sapphon-222-external-anchor.yml'
      - 'docs/sapphon/phase-xx/222/**'
permissions:
  contents: read
jobs:
  external-anchor-no-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute real Ed25519 signature and anchored-key negative controls
        run: |
          python3 -m py_compile tools/sapphon_221_attestation.py tools/sapphon_222_external_anchor.py tools/test_sapphon_222_external_anchor.py
          python3 tools/test_sapphon_222_external_anchor.py
      - name: Emit evidence-bound missing-anchor HOLD verdict
        run: |
          mkdir -p qualification-evidence
          printf '{}\n' > qualification-evidence/222-unprovided-external-receipt.json
          set +e
          python3 tools/sapphon_222_external_anchor.py \
            --receipt qualification-evidence/222-unprovided-external-receipt.json \
            --out qualification-evidence/222-external-anchor-verdict.json
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import json
          v=json.load(open("qualification-evidence/222-external-anchor-verdict.json"))
          assert v["state"]=="EXTERNAL_ANCHOR_REJECTED_HOLD"
          assert v["independently_authenticated_witnesses"]==0
          assert v["recovery_authorized"] is False and v["lock_cleared"] is False
          print("SAPPHON_222_EXTERNAL_KEY_PROVISIONING_UNVERIFIED__RECOVERY_HOLD")
          PY
      - name: Preserve append-only source-owned negative-control verdict
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-222-independent-key-anchor-hold
          path: qualification-evidence/222-external-anchor-verdict.json
          retention-days: 30
          if-no-files-found: error
