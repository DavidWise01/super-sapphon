name: SAPPHON-148 Interrupted Rotation and Failover Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - '.github/workflows/sapphon-148-failover.yml'
      - 'docs/sapphon/phase-xiii/148/**'
permissions:
  contents: read
jobs:
  failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust SAPPHON-148 failover and all inherited liveness tests
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Inherited recovery contention journal and audit suites
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify 188 historic frozen files
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
              'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
              'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
              'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
              'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          count=0
          for manifest in manifests:
              for path,expected in json.loads(pathlib.Path(manifest).read_text())['files'].items():
                  b=pathlib.Path(path).read_bytes()
                  assert len(b)==expected['bytes'],path
                  assert hashlib.sha256(b).hexdigest()==expected['sha256'],path
                  count+=1
          assert count==188,count
          print(f'PASS {count}/188 historical source hashes')
          PY
      - name: Check failover never promotes recovery authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('rust/sapphon-liveness/src/failover148.rs').read_text()
          for term in ('pub const AUTHORITY:&str="HOLD"',
             'replacement_key_accepted:false','independent_custody_acknowledged:false',
             'lock_cleared:false','FAILOVER_ALREADY_EXISTS','FailoverFinding::ProviderMissing',
             'FailoverFinding::OneDelayed'):
              assert term in s,term
          print('PASS HOLD source invariant')
          PY
      - name: Build Rust documentation
        run: cargo doc --manifest-path rust/sapphon-liveness/Cargo.toml --no-deps
