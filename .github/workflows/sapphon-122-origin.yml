name: SAPPHON-122 Enrollment Origin and Key Rotation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_122_origin.cjs'
      - 'tools/test_sapphon_122_origin.cjs'
      - 'docs/sapphon/phase-x/122/**'
      - '.github/workflows/sapphon-122-origin.yml'
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify enrollment issuer control, rotation fencing and ancestry attacks
        run: node tools/test_sapphon_122_origin.cjs
      - name: Preserve inherited custodian and checkpoint regression
        run: |
          node tools/test_sapphon_121_custodian.cjs
          node tools/test_sapphon_120_audit.cjs
      - name: Verify neon viewer and all four immutable frozen phases
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-x/122/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase X · 2/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-122 neon viewer syntax and external qualification HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json','docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json'):
              d=json.loads(pathlib.Path(p).read_text())
              for f,record in d['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],f
              print('PASS',p,len(d['files']),'frozen hashes')
          PY
