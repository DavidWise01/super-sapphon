name: SAPPHON-197 Monotonic Cross-Readback Evidence and Fork Attribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_197_*.py'
      - 'tools/test_sapphon_197_*.py'
      - '.github/workflows/sapphon-197-monotonic.yml'
      - 'docs/sapphon/phase-xix/197/**'
permissions:
  contents: read
  actions: read
jobs:
  monotonic-original-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test Python append-only chain and existing original-byte regression gates
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_197_ledger.py
          python3 tools/test_sapphon_196_reacquire.py
          python3 tools/test_sapphon_195_crossverify.py
      - name: Compile and test Rust source readback and inherited modules
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify immutable historical 188 files
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Import genuine exact SAPPHON-196 prior readback if available
        id: prior
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_197_import.py \
            --out qualification-artifact/197-import.json \
            --readback qualification-artifact/197-prior-196.json
      - name: Fresh separate original-byte request for same pinned GitHub ancestry
        id: current
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_196_reacquire.py --out qualification-artifact/197-current-196.json
      - name: Append ordered source-owned events without inferring missing originals
        id: ledger
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p qualification-artifact
          if [[ ! -f qualification-artifact/197-prior-196.json ]]; then
            printf '{}\n' > qualification-artifact/197-prior-196.json
          fi
          if [[ ! -f qualification-artifact/197-current-196.json ]]; then
            printf '{}\n' > qualification-artifact/197-current-196.json
          fi
          python3 tools/sapphon_197_ledger.py \
            --readback qualification-artifact/197-prior-196.json \
            --ledger-out qualification-artifact/197-first.jsonl \
            --report-out qualification-artifact/197-first-adjudication.json
          python3 tools/sapphon_197_ledger.py \
            --previous qualification-artifact/197-first.jsonl \
            --readback qualification-artifact/197-current-196.json \
            --ledger-out qualification-artifact/197-ledger.jsonl \
            --report-out qualification-artifact/197-adjudication.json
      - name: Keep current test execution, predecessor availability and custody distinct
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PRIOR: ${{ steps.prior.outcome }}
          CURRENT: ${{ steps.current.outcome }}
          LEDGER: ${{ steps.ledger.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          steps={k:os.environ[k] for k in ('PYTHON','RUST','FROZEN','PRIOR','CURRENT','LEDGER')}
          p=pathlib.Path('qualification-artifact/197-adjudication.json')
          record=json.loads(p.read_text()) if p.is_file() else {}
          body={'schema':'sapphon-197-owned-run-results-v1',
            'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':steps,'source_tests_pass':all(steps[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'source_owned_forks':len(record.get('forks',[])),
            'prior_readback_observed':steps['PRIOR']=='success',
            'fresh_readback_observed':steps['CURRENT']=='success',
            'ledger_complete':steps['LEDGER']=='success',
            'cross_run_chain_continuity_verified':False,
            'independent_witnesses':0,'external_custody_authenticated':False,
            'authenticated_utc':False,'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'MONOTONIC_READBACK_EVIDENCE_HOLD'}
          pathlib.Path('qualification-artifact/197-summary.json').write_text(
            json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve sanitized ordered readback findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-197-monotonic-readback-evidence
          path: |
            qualification-artifact/197-import.json
            qualification-artifact/197-ledger.jsonl
            qualification-artifact/197-adjudication.json
            qualification-artifact/197-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on source test failures or observed source-owned fork
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          LEDGER: ${{ steps.ledger.outcome }}
        run: |
          for k in PYTHON RUST FROZEN LEDGER; do
            if [[ "${!k}" != success ]]; then
              echo "::error::$k = ${!k}; HOLD"
              exit 1
            fi
          done
          echo "Owned ledger recorded; cross-run custody, UTC and recovery remain HOLD."
