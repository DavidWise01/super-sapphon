name: SAPPHON-144 Phase XII Final Evidence Freeze Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - '.github/workflows/sapphon-144-freeze.yml'
      - 'docs/sapphon/phase-xii/144/**'
permissions:
  contents: read
jobs:
  frozen-source-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Linux Rust source and Phase XII evidence regressions
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Inherited Rust lock, journal, and audit regressions
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Verify all 188 historical frozen source hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=(
              'docs/sapphon/SAPPHON-096-FREEZE.json',
              'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
              'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
              'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
              'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json'
          )
          total=0
          for name in manifests:
              files=json.loads(pathlib.Path(name).read_text())['files']
              for path,expected in files.items():
                  data=pathlib.Path(path).read_bytes()
                  assert len(data)==expected['bytes'],path
                  assert hashlib.sha256(data).hexdigest()==expected['sha256'],path
              total+=len(files)
          assert total==188,total
          print(f'PASS {total}/188 inherited hashes')
          PY
      - name: Prove SAPPHON-144 never promotes evidence to operational authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('rust/sapphon-liveness/src/freeze144.rs').read_text()
          for invariant in ('pub const AUTHORITY: &str = "HOLD"',
                            'EVIDENCE_CONFLICT_HOLD',
                            'DESIGN_COMPLETE_QUALIFICATION_HOLD',
                            'independent_custody_qualified:false',
                            'source_evidence_qualified:false',
                            'ci_verified:false',
                            'lock_cleared:false',
                            'global_anti_rollback:false',
                            'authenticated_utc:false'):
              assert invariant in s,invariant
          print('PASS source-level HOLD invariants')
          PY
      - name: Verify documentation and Rust API
        run: cargo doc --manifest-path rust/sapphon-liveness/Cargo.toml --no-deps
