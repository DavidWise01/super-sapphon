name: SAPPHON-111 Durable Capture & Retention
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_111_durable_capture.cjs'
      - 'tools/test_sapphon_111_durable_capture.cjs'
      - 'docs/sapphon/phase-viii/111/**'
      - '.github/workflows/sapphon-111-durable.yml'
permissions:
  contents: read
jobs:
  durable:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent capture replay and signed synthetic retention
        run: node tools/test_sapphon_111_durable_capture.cjs
      - name: Preserve capture-agent and transport evidence regressions
        run: |
          node tools/test_sapphon_110_capture.cjs
          node tools/test_sapphon_109_transcript.cjs
      - name: Validate neon source and preserved immutable phases
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-viii/111/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase VIII · 7/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-111 neon viewer and HOLD');
          NODE
          python3 - <<'PY'
          import hashlib,json,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json'):
              m=json.loads(pathlib.Path(p).read_text())
              for name,item in m['files'].items():
                  assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==item['sha256'],name
              print('PASS',p,len(m['files']),'immutable hashes')
          PY
