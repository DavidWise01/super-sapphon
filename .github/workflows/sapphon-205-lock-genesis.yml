name: SAPPHON-205 Cargo Lock Genesis and Offline Vendor Provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_205_*.py'
      - 'tools/test_sapphon_205_*.py'
      - '.github/workflows/sapphon-205-lock-genesis.yml'
      - 'docs/sapphon/phase-xx/205/**'
permissions:
  contents: read
  actions: read
jobs:
  observed-lock-genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline provenance negative controls
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_205_lock_provenance.py
          python3 tools/test_sapphon_204_offline_rust.py
      - name: Current Rust compilation and tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify 188 protected historical files
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Generate genuine Cargo resolution lockfile
        id: generate
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p qualification-artifact
          cargo generate-lockfile --manifest-path rust/sapphon-liveness/Cargo.toml
          test -s rust/sapphon-liveness/Cargo.lock
          cp rust/sapphon-liveness/Cargo.lock qualification-artifact/Cargo.lock
      - name: Vendor exact locked dependencies from observed resolver output
        id: vendor
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p qualification-artifact/vendor "$RUNNER_TEMP/sapphon205-offline"
          cargo vendor --locked --manifest-path rust/sapphon-liveness/Cargo.toml \
            "$PWD/qualification-artifact/vendor" \
            > "$RUNNER_TEMP/sapphon205-offline/config.toml"
          test -s "$RUNNER_TEMP/sapphon205-offline/config.toml"
      - name: Verify locked offline Cargo metadata and compilation
        id: offline
        if: steps.vendor.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/sapphon205-offline"
          export CARGO_NET_OFFLINE=true
          cargo metadata --format-version 1 --locked --offline \
            --manifest-path rust/sapphon-liveness/Cargo.toml \
            > qualification-artifact/205-metadata.json
          cargo check --locked --offline --all-targets \
            --manifest-path rust/sapphon-liveness/Cargo.toml
      - name: Validate actual generated lock and observed offline steps
        id: provenance
        if: always()
        continue-on-error: true
        env:
          GENERATE: ${{ steps.generate.outcome }}
          VENDOR: ${{ steps.vendor.outcome }}
          OFFLINE: ${{ steps.offline.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          states={k:os.environ[k] for k in ("GENERATE","VENDOR","OFFLINE")}
          flags={'lock_generation':states['GENERATE']=='success',
           'vendor':states['VENDOR']=='success',
           'offline_metadata':states['OFFLINE']=='success',
           'offline_check':states['OFFLINE']=='success'}
          pathlib.Path('qualification-artifact/205-checks.json').write_text(
           json.dumps(flags,sort_keys=True,indent=2)+'\n')
          PY
          if [[ -f qualification-artifact/Cargo.lock && -f qualification-artifact/205-metadata.json ]]; then
            python3 tools/sapphon_205_lock_provenance.py \
              --manifest rust/sapphon-liveness/Cargo.toml \
              --lock qualification-artifact/Cargo.lock \
              --metadata qualification-artifact/205-metadata.json \
              --checks qualification-artifact/205-checks.json \
              --out qualification-artifact/205-provenance.json
          else
            python3 - <<'PY'
          import json,pathlib
          body={'schema':'sapphon-205-cargo-provenance-v1',
            'state':'LOCK_OR_OFFLINE_METADATA_UNAVAILABLE',
            'offline_verified':False,'image_digest_verified':False,
            'replay_executed':False,'recovery_authorized':False,
            'lock_cleared':False,'decision':'PHASE_XX_DEPENDENCY_PROVENANCE_HOLD'}
          pathlib.Path('qualification-artifact/205-provenance.json').write_text(
           json.dumps(body,sort_keys=True,indent=2)+'\n')
          PY
            exit 1
          fi
      - name: Write source/hosted checks without claiming external image custody
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          VENDOR: ${{ steps.vendor.outcome }}
          OFFLINE: ${{ steps.offline.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          steps={k:os.environ[k] for k in ("PYTHON","RUST","FROZEN","GENERATE","VENDOR","OFFLINE","PROVENANCE")}
          p=pathlib.Path('qualification-artifact/205-provenance.json')
          proven=json.loads(p.read_text()) if p.exists() else {}
          data={'schema':'sapphon-205-source-owned-run-v1','commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'steps':steps,'source_tests_pass':all(steps[k]=='success' for k in ("PYTHON","RUST","FROZEN")),
            'generated_lock_observed':steps['GENERATE']=='success',
            'offline_dependency_check_observed':proven.get('offline_verified') is True,
            'lockfile_sha256':proven.get('lockfile_sha256'),
            'image_digest_authenticated':False,'rust_replay_executed':False,
            'independent_witnesses':0,'authenticated_utc':False,
            'global_anti_rollback_authenticated':False,'recovery_authorized':False,
            'lock_cleared':False,'decision':'PHASE_XX_DEPENDENCY_PROVENANCE_HOLD'}
          pathlib.Path('qualification-artifact/205-summary.json').write_text(
            json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload original generated lock and sanitized provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-205-cargo-lock-and-offline-provenance
          path: |
            qualification-artifact/Cargo.lock
            qualification-artifact/205-metadata.json
            qualification-artifact/205-checks.json
            qualification-artifact/205-provenance.json
            qualification-artifact/205-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail on source or genuine offline verification failure
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          VENDOR: ${{ steps.vendor.outcome }}
          OFFLINE: ${{ steps.offline.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
        run: |
          for key in PYTHON RUST FROZEN GENERATE VENDOR OFFLINE PROVENANCE; do
            if [[ "${!key}" != success ]]; then
              echo "::error::$key = ${!key}; Cargo provenance HOLD"
              exit 1
            fi
          done
          echo "Offline source-owned dependency verification observed; image/custody/recovery HOLD."
