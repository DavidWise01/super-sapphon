name: SAPPHON-097 Signed Source Provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_097_auth.cjs'
      - 'tools/test_sapphon_097_auth.cjs'
      - 'docs/sapphon/phase-vii/**'
      - '.github/workflows/sapphon-097-provenance.yml'

permissions:
  contents: read

jobs:
  source-authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify real Ed25519 signatures and reject forgeries
        run: node tools/test_sapphon_097_auth.cjs
      - name: Inspect Phase VII read-only browser script
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-vii/index.html','utf8');
          const s=h.match(/<script>([\s\S]*?)<\/script>/);
          assert(s,'Browser script absent');
          new vm.Script(s[1]);
          for(const marker of ['R · HOT +1','G · NEITHER 0','B · COLD -1','SAPPHON-097','UNAUTHENTICATED','NOT GRANTED']){
            assert(h.includes(marker),'Missing '+marker);
          }
          console.log('PASS: Phase VII browser script parses, three pump identities and authentication warnings retained');
          NODE
      - name: Assert frozen Phase VI baseline remains isolated
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          freeze=json.loads(pathlib.Path('docs/sapphon/SAPPHON-096-FREEZE.json').read_text())
          for name,item in freeze['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==item['sha256'],name
          print('PASS: Phase VI SHA-256 baseline intact for',len(freeze['files']),'files')
          PY
