name: SAPPHON-121 Custodian Ancestry Qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_121_custodian.cjs'
      - 'tools/test_sapphon_121_custodian.cjs'
      - 'docs/sapphon/phase-x/121/**'
      - '.github/workflows/sapphon-121-custodian.yml'
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned signer roots, source ancestry and forged independence rejection
        run: node tools/test_sapphon_121_custodian.cjs
      - name: Retain verified synthetic monotonic anchor and handshakes
        run: |
          node tools/test_sapphon_120_audit.cjs
          node tools/test_sapphon_118_anchor.cjs
      - name: Validate neon laboratory and all four frozen software phases
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-x/121/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase X · 1/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-121 neon clock syntax and physical authority HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json','docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json'):
              d=json.loads(pathlib.Path(p).read_text())
              for f,record in d['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],f
              print('PASS',p,len(d['files']),'frozen hashes')
          PY
