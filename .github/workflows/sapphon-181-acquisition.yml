name: SAPPHON-181 Original Byte Acquisition and Safe ZIP Inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_181_*.py'
      - 'tools/test_sapphon_181_zip.py'
      - '.github/workflows/sapphon-181-acquisition.yml'
      - 'docs/sapphon/phase-xvii/181/**'
permissions:
  contents: read
  actions: read
jobs:
  safe-original-byte-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run Python ZIP security and original-byte binding tests
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_181_zip.py
          python3 tools/test_sapphon_180_bind.py
          python3 tools/test_sapphon_179_replay.py
      - name: Compile Rust source and execute liveness tests
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Recheck historical 188-file freeze immutability
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Obtain exact SAPPHON-180 original job and ZIP evidence
        id: acquire
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRIVATE_DIR="$(mktemp -d)"
          chmod 700 "$PRIVATE_DIR"
          echo "PRIVATE_DIR=$PRIVATE_DIR" >> "$GITHUB_ENV"
          mkdir -p qualification-artifact
          python3 tools/sapphon_181_acquire.py \
            --private-dir "$PRIVATE_DIR" \
            --out qualification-artifact/181-acquisition.json
      - name: Inspect original archive in memory, never extract
        id: inspect
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -n "${PRIVATE_DIR:-}" && -f "$PRIVATE_DIR/181-original-artifact.zip" && -f "$PRIVATE_DIR/181-manifest.json" ]]; then
            python3 tools/sapphon_181_zip.py \
              --artifact-zip "$PRIVATE_DIR/181-original-artifact.zip" \
              --metadata "$PRIVATE_DIR/181-manifest.json" \
              --out qualification-artifact/181-inspection.json
          else
            python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('qualification-artifact/181-inspection.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'schema':'sapphon-181-unavailable-v1',
            'status':'ORIGINAL_BYTES_UNAVAILABLE','source_owned_zip_consistent':False,
            'independent_custody_authenticated':False,'recovery_authorized':False,
            'decision':'ARCHIVE_ADJUDICATION_HOLD'},indent=2,sort_keys=True)+'\n')
          PY
          fi
      - name: Delete temporary unredacted source bytes
        if: always()
        run: |
          if [[ -n "${PRIVATE_DIR:-}" && -d "$PRIVATE_DIR" ]]; then
            rm -f -- "$PRIVATE_DIR/181-original-job.log" "$PRIVATE_DIR/181-original-artifact.zip" "$PRIVATE_DIR/181-manifest.json"
            rmdir "$PRIVATE_DIR" || true
          fi
      - name: Record distinct run-test and source-acquisition outcomes
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          ACQUIRE: ${{ steps.acquire.outcome }}
          INSPECT: ${{ steps.inspect.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          kinds=('PYTHON','RUST','FROZEN','ACQUIRE','INSPECT')
          status={k:os.environ[k] for k in kinds}
          result={'schema':'sapphon-181-owned-evidence-v1',
            'commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'checks':status,
            'source_owned_tests_pass':all(status[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'full_qualification':False,
            'external_metadata_authenticated':False,
            'independent_custody_authenticated':False,
            'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'ORIGINAL_BYTE_ACQUISITION_HOLD'}
          pathlib.Path('qualification-artifact/181-summary.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload only redacted metadata and diagnostic findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-181-safe-zip-findings
          path: |
            qualification-artifact/181-acquisition.json
            qualification-artifact/181-inspection.json
            qualification-artifact/181-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail if Python, Rust or frozen hashes actually fail
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for k in PYTHON RUST FROZEN; do
            if [[ "${!k}" != success ]]; then
              echo "::error::$k = ${!k}; HOLD"
              exit 1
            fi
          done
          echo "Source-owned tests checked. Original byte readback, external custody and recovery remain independent gates."
