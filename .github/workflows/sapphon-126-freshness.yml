name: SAPPHON-126 Fresh High-Water Challenge and Partition Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_126_freshness.cjs'
      - 'tools/test_sapphon_126_freshness.cjs'
      - 'docs/sapphon/phase-x/126/**'
      - '.github/workflows/sapphon-126-freshness.yml'
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed freshness, expiry, partition and key rotation
        run: node tools/test_sapphon_126_freshness.cjs
      - name: Preserve inherited replica and current-revocation regressions
        run: |
          node tools/test_sapphon_125_replica.cjs
          node tools/test_sapphon_124_revocation.cjs
      - name: Check neon viewer and all 140 inherited frozen files
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-x/126/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase X · 6/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-126 neon viewer and authority HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json','docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json'):
              d=json.loads(pathlib.Path(p).read_text())
              for f,record in d['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],f
              print('PASS',p,len(d['files']),'frozen hashes')
          PY
