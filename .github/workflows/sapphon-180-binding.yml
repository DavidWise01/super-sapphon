name: SAPPHON-180 Authenticated Failure Artifact Binding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - 'tools/sapphon_180_*.py'
      - 'tools/test_sapphon_180_bind.py'
      - 'tools/sapphon_171_job_logs.py'
      - '.github/workflows/sapphon-180-binding.yml'
      - 'docs/sapphon/phase-xvii/180/**'
permissions:
  contents: read
  actions: read
jobs:
  artifact-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run Python raw-byte tamper regressions
        id: python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/test_sapphon_180_bind.py
          python3 tools/test_sapphon_179_replay.py
          python3 tools/test_sapphon_178_isolate.py
          python3 tools/test_sapphon_171_job_logs.py
      - name: Run Rust liveness typecheck and regression suite
        id: rust
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo check --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Verify 188 protected historical hashes
        id: frozen
        continue-on-error: true
        run: python3 tools/sapphon_179_verify_frozen.py
      - name: Observe exact pinned predecessor run and job steps
        id: predecessor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifact
          python3 tools/sapphon_171_job_logs.py \
            --sha d07203a254678fdf7df05a75c1d144c7a8337f87 \
            --workflow sapphon-179-replay.yml \
            --required-job replay-diagnostics \
            --out qualification-artifact/180-predecessor.json
      - name: Verify original raw evidence if separately supplied
        id: original_bytes
        continue-on-error: true
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('qualification-artifact')
          files=(p/'180-manifest.json',p/'180-raw-job.log',p/'180-original-artifact.zip')
          if all(f.is_file() for f in files):
            subprocess.run(['python3','tools/sapphon_180_bind.py',
              '--manifest',str(files[0]),'--raw-log',str(files[1]),
              '--artifact-zip',str(files[2]),'--out',str(p/'180-binding.json')],check=True)
          else:
            (p/'180-binding.json').write_text(json.dumps({
              'schema':'sapphon-180-evidence-unavailable-v1',
              'status':'ORIGINAL_BYTES_NOT_SUPPLIED',
              'missing':[f.name for f in files if not f.is_file()],
              'binding_qualified':False,'recovery_authorized':False,
              'decision':'RAW_EVIDENCE_BINDING_HOLD'},sort_keys=True,indent=2)+'\n')
          PY
      - name: Record independent check outcomes without promoting authority
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
          PREDECESSOR: ${{ steps.predecessor.outcome }}
          ORIGINAL_BYTES: ${{ steps.original_bytes.outcome }}
        run: |
          mkdir -p qualification-artifact
          python3 - <<'PY'
          import json,os,pathlib
          keys=('PYTHON','RUST','FROZEN','PREDECESSOR','ORIGINAL_BYTES')
          status={k:os.environ[k] for k in keys}
          doc={'schema':'sapphon-180-owned-source-evidence-v1',
            'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'steps':status,
            'source_owned_diagnostics_pass':all(status[k]=='success' for k in ('PYTHON','RUST','FROZEN')),
            'original_bytes_authenticated':False,
            'full_qualification':False,'independent_custody_authenticated':False,
            'global_anti_rollback_authenticated':False,
            'recovery_authorized':False,'lock_cleared':False,
            'decision':'RAW_EVIDENCE_BINDING_HOLD'}
          pathlib.Path('qualification-artifact/180-summary.json').write_text(
            json.dumps(doc,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload diagnostic results, not unredacted raw log bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphon-180-byte-binding
          path: |
            qualification-artifact/180-predecessor.json
            qualification-artifact/180-binding.json
            qualification-artifact/180-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail only on current source diagnostic errors
        if: always()
        env:
          PYTHON: ${{ steps.python.outcome }}
          RUST: ${{ steps.rust.outcome }}
          FROZEN: ${{ steps.frozen.outcome }}
        run: |
          for n in PYTHON RUST FROZEN; do
            if [[ "${!n}" != success ]]; then
              echo "::error::$n = ${!n}; source gate failed"
              exit 1
            fi
          done
          echo "GitHub-owned diagnostics evaluated; external custody, byte acquisition, and recovery HOLD."
