name: SAPPHON-101 Anchor Fork & Rollback Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_101_anchor.cjs'
      - 'tools/test_sapphon_101_anchor.cjs'
      - 'tools/sapphon_101_export.cjs'
      - 'docs/sapphon/phase-vii/101/**'
      - '.github/workflows/sapphon-101-anchor.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test anchored ledger continuation, historical forks and rollbacks
        run: node tools/test_sapphon_101_anchor.cjs
      - name: Export a verified synthetic custody-request anchor
        run: |
          node tools/sapphon_100_export.cjs --test-fixture /tmp/sapphon101
          node tools/sapphon_101_export.cjs /tmp/sapphon101/audit.json /tmp/sapphon101/governance-public.pem test-governance-100 /tmp/sapphon101/anchor.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const anchor=JSON.parse(fs.readFileSync('/tmp/sapphon101/anchor.json','utf8'));
          assert.equal(anchor.count,3);
          assert.equal(anchor.independently_retained,false);
          assert.equal(anchor.recorded_utc,null);
          console.log('PASS anchor export: valid request, explicitly not an external registration');
          NODE
      - name: Preserve inherited enrollment and checkpoint contract
        run: |
          node tools/test_sapphon_099_enrollment.cjs
          node tools/test_sapphon_098_chain.cjs
      - name: Check freeze hashes and Phase VII neon JavaScript
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-vii/101/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const required of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','EXTERNAL ANCHOR NOT YET REGISTERED'])
            assert(h.includes(required),'Missing '+required);
          console.log('PASS Phase VII visual syntax and truthful custody boundary');
          NODE
          python3 - <<'PY'
          import hashlib,json,pathlib
          freeze=json.loads(pathlib.Path('docs/sapphon/SAPPHON-096-FREEZE.json').read_text())
          for name,meta in freeze['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==meta['sha256'],name
          print('PASS',len(freeze['files']),'immutable Phase VI source hashes')
          PY
