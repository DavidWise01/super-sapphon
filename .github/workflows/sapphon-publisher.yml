name: SAPPHON-096 Phase VI Browser Acceptance & Freeze

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/sapphon/source/clock.json'
      - 'docs/sapphon/source/incoming.json'
      - 'tools/sapphon_publish.py'
      - 'docs/sapphon/monitor.js'
      - 'docs/sapphon/index.html'
      - 'tools/test_sapphon_monitor.cjs'
      - 'tools/test_sapphon_checkpoint.cjs'
      - 'tools/sapphon_verify_checkpoint.py'
      - 'tools/test_sapphon_browser.cjs'
      - 'tools/sapphon_freeze.py'
      - '.github/workflows/sapphon-publisher.yml'

permissions:
  contents: write

concurrency:
  group: sapphon-clock-publisher
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser stream-health contract
        run: node tools/test_sapphon_monitor.cjs
      - name: Validate browser checkpoint recovery and HTML syntax
        run: node tools/test_sapphon_checkpoint.cjs
      - name: Independently verify checkpoint source and tampering detection
        run: python tools/sapphon_verify_checkpoint.py --test
      - name: Validate recorded clock input and injection rejection
        run: python tools/sapphon_publish.py --test
      - name: Produce read-only JSON output
        run: python tools/sapphon_publish.py
      - name: Verify publication matches source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.sapphon_publish import validate_archive, reconcile
          source = json.loads(Path("docs/sapphon/source/clock.json").read_text())
          result = json.loads(Path("docs/sapphon/live/clock.json").read_text())
          incoming = Path("docs/sapphon/source/incoming.json")
          batch = json.loads(incoming.read_text()) if incoming.exists() else None
          expected, expected_mode = reconcile(source,batch)
          assert result["records"] == expected
          assert result["mode"] == expected_mode
          assert all(all(a[k] is b[k] for k in ("second", "minute", "day")) for a,b in zip(expected,result["records"]))
          print("PASS: all authorization flags preserved; zero generated time readings")
          PY
      - name: Install browser acceptance dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium visual and recovery acceptance
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sapphon-http.log 2>&1 &
          sleep 2
          node tools/test_sapphon_browser.cjs
      - name: Generate and verify immutable software freeze
        run: python tools/sapphon_freeze.py
      - name: Commit published JSON and frozen evidence only if changed
        run: |
          git add docs/sapphon/live/clock.json docs/sapphon/SAPPHON-096-FREEZE.json
          if git diff --cached --quiet; then
            echo "No change: archived clock export already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'SAPPHON-096: publish read-only clock and freeze verified Phase VI source'
          git push origin HEAD:main
