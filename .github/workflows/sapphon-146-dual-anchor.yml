name: SAPPHON-146 Phase XIII Dual Anchor Qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/sapphon-liveness/**'
      - '.github/workflows/sapphon-146-dual-anchor.yml'
      - 'docs/sapphon/phase-xiii/146/**'
permissions:
  contents: read
jobs:
  dual-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run dual provider and inherited liveness Rust regressions
        run: cargo test --manifest-path rust/sapphon-liveness/Cargo.toml --all-targets -- --test-threads=1
      - name: Run inherited recovery contention journal and audit suites
        run: |
          cargo test --manifest-path rust/sapphon-recovery/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-contention/Cargo.toml --all-targets -- --test-threads=1
          cargo test --manifest-path rust/sapphon-journal/Cargo.toml --all-targets
          cargo test --manifest-path rust/sapphon-audit/Cargo.toml --all-targets
      - name: Validate 188 immutable historic hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifests=('docs/sapphon/SAPPHON-096-FREEZE.json',
              'docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json',
              'docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json',
              'docs/sapphon/phase-ix/SAPPHON-120-FREEZE.json',
              'docs/sapphon/phase-x/SAPPHON-128-FREEZE.json')
          n=0
          for manifest in manifests:
              for path,expected in json.loads(pathlib.Path(manifest).read_text())['files'].items():
                  b=pathlib.Path(path).read_bytes()
                  assert len(b)==expected['bytes'],path
                  assert hashlib.sha256(b).hexdigest()==expected['sha256'],path
                  n+=1
          assert n==188,n
          print(f'PASS {n}/188 inherited immutable hashes')
          PY
      - name: Check dual provider authority stays HOLD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('rust/sapphon-liveness/src/dual_anchor146.rs').read_text()
          for token in ('pub const AUTHORITY: &str = "HOLD"',
                        'independent_custody_proven: false',
                        'external_checkpoint_accepted: false',
                        'lock_cleared: false',
                        'DUAL_SHARED_ANCESTRY',
                        'DUAL_SHARED_SIGNING_KEY',
                        'ConflictingHeadAtSameSequence'):
              assert token in source,token
          print('PASS source-level HOLD only')
          PY
      - name: Rust documentation build
        run: cargo doc --manifest-path rust/sapphon-liveness/Cargo.toml --no-deps
