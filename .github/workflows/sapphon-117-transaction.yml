name: SAPPHON-117 Transactional Receiver Commit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/sapphon_117_transaction.cjs'
      - 'tools/test_sapphon_117_transaction.cjs'
      - 'docs/sapphon/phase-ix/117/**'
      - '.github/workflows/sapphon-117-transaction.yml'
permissions:
  contents: read
jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify receiver inbox and synthetic effect transaction coupling
        run: node tools/test_sapphon_117_transaction.cjs
      - name: Preserve sender receiver replay and local crash recovery regressions
        run: |
          node tools/test_sapphon_116_outbox_inbox.cjs
          node tools/test_sapphon_115_reconcile.cjs
      - name: Verify neon viewer and prior frozen phase manifests
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('docs/sapphon/phase-ix/117/index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);assert(m);
          new vm.Script(m[1]);
          for(const s of ['{{i}}','R HOT +1','G NEITHER 0','B COLD -1','PHYSICAL CLOCK + CUSTODY HOLD','Phase IX · 5/8'])
            assert(h.includes(s),'Missing '+s);
          console.log('PASS SAPPHON-117 neon viewer and authority HOLD');
          NODE
          python3 - <<'PY'
          import json,hashlib,pathlib
          for p in ('docs/sapphon/SAPPHON-096-FREEZE.json','docs/sapphon/phase-vii/SAPPHON-104-FREEZE.json','docs/sapphon/phase-viii/SAPPHON-112-FREEZE.json'):
              m=json.loads(pathlib.Path(p).read_text())
              for f,record in m['files'].items():
                  blob=pathlib.Path(f).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==record['sha256'] and len(blob)==record['bytes'],f
              print('PASS',p,len(m['files']),'frozen hashes')
          PY
